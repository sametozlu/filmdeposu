name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore FilmSerileri.sln

      - name: Build
        run: dotnet build FilmSerileri.sln --no-restore -c Release

      - name: Test
        run: dotnet test FilmSerileri.sln --no-build -c Release --verbosity normal

  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build app
        run: dotnet build FilmSerileri.csproj -c Release

      - name: Build E2E project
        run: dotnet build FilmSerileri.E2E -c Release

      - name: Install Playwright browsers
        run: pwsh FilmSerileri.E2E/bin/Release/net8.0/playwright.ps1 install chromium --with-deps

      - name: Start app
        run: |
          dotnet run --project FilmSerileri.csproj -c Release --no-build &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health > /dev/null; then
              echo "App is up"; break
            fi
            sleep 2
          done
        env:
          PORT: 8080

      - name: Run E2E tests
        run: dotnet test FilmSerileri.E2E -c Release --no-build --verbosity normal
        env:
          E2E_BASE_URL: http://localhost:8080
